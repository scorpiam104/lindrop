<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-labelledby="title desc">
  <title id="title">LinkPay</title>
  <desc id="desc">LinkPay interlocking links and payment arrow logo</desc>
  <defs>
    <linearGradient id="linkPayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="50%" stop-color="#4364F7" />
      <stop offset="100%" stop-color="#6FB1FC" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6FB1FC" />
    </marker>
  </defs>
  <g transform="translate(20, 25)">
    <rect x="20" y="45" width="70" height="60" rx="30" fill="none" stroke="url(#linkPayGrad)" stroke-width="16" />
    <rect x="65" y="45" width="70" height="60" rx="30" fill="none" stroke="#0052D4" stroke-width="16" opacity="0.9" />
    <path d="M 45 110 C 70 110, 100 80, 120 40" fill="none" stroke="#6FB1FC" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)" />
  </g>
  <text x="180" y="115" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="800" fill="#0A2540" letter-spacing="-1">Link</text>
  <text x="305" y="115" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="400" fill="url(#linkPayGrad)" letter-spacing="-1">Pay</text>
  <circle cx="422" cy="70" r="6" fill="#6FB1FC" />
</svg>
